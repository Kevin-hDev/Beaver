<svg xmlns="http://www.w3.org/2000/svg" viewBox="1479 3031 14854 13598">
<title>Castor Beaver, decoupe</title>
<!-- POCHOIR. Ce fichier n'est jamais affiche tel quel : il sert de masque CSS, et
     seule sa silhouette compte. La couleur vient du CSS de l'application, ce qui
     permet a la marque de suivre les six palettes de Beaver.

     Il va par paire avec castor-encre.svg. Les deux fichiers portent
     le MEME viewBox, et c'est ce qui les aligne : les deux calques sont poses
     l'un sur l'autre avec "center / contain", donc un cadre different sur l'un
     des deux les decalerait en silence. Le test brand-assets le verifie.

     La decoupe : le support pose sous l'encre. Union des 63 contours exterieurs,
     fermee au rayon 1400 pour que le fond ne s'enfonce pas en coins dans la tete,
     trous internes supprimes, puis elargie de 550 unites par le contour ci-dessous. -->
