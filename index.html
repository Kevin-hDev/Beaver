<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beaver</title>
    <script>
      (function() {
        var themeSchemes = Object.freeze({
          "light": "light",
          "dark": "dark",
          "emerald-night": "dark",
          "cobalt-frost": "light",
          "astral-mist": "dark",
          "crimson-eclipse": "dark"
        });
        var choice = "system";
        try {
          choice = localStorage.getItem("clgo-theme") || "system";
        } catch (_error) {
          choice = "system";
        }
        var colorScheme = Object.prototype.hasOwnProperty.call(themeSchemes, choice)
          ? themeSchemes[choice]
          : null;
        if (!colorScheme) {
          choice = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          colorScheme = choice;
        }
        document.documentElement.setAttribute("data-theme", colorScheme);
        document.documentElement.setAttribute("data-palette", choice);
        /* Même détection que src/lib/platform.ts, écrite ici parce que le
           splash s'affiche avant React. splash-window-corners.test.ts vérifie
           que les deux disent la même chose. */
        document.documentElement.setAttribute(
          "data-os",
          navigator.userAgent.includes("Mac") ? "mac" : "other"
        );
      })();
    </script>
    <link rel="preload" href="/castor-surface.svg" as="image" type="image/svg+xml" />
    <link rel="preload" href="/castor-encre.svg" as="image" type="image/svg+xml" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      /* Windows et Linux : la fenêtre perd ses décorations au démarrage
         (app_build.rs), c'est donc au contenu de dessiner le coin. La valeur
         reprend --radius-window de tokens.css, que ce bloc ne peut pas lire —
         il peint avant les feuilles de style. */
      [data-os="other"] #splash {
        border-radius: 16px;
      }
      /* Le castor est un dessin en aplats, donc deux couleurs : la découpe claire
         posée dessous, l'encre par-dessus. Les palettes sombres et claires les
         échangent — sur fond sombre la découpe prend --ink et l'encre prend --void,
         sur fond clair l'inverse, ce qui rend la découpe invisible puisqu'elle vaut
         alors la couleur du fond. Les valeurs sont écrites en dur parce que ce bloc
         peint avant que les feuilles de thème soient chargées ; splash-theme.test.ts
         vérifie palette par palette qu'elles valent bien --void et --ink. */
      [data-theme="dark"] #splash {
        background: #121212;
        --splash-surface: #dcdce0;
        --splash-mark: #121212;
      }
      [data-theme="light"] #splash {
        background: #f7f6f3;
        --splash-surface: #f7f6f3;
        --splash-mark: #1a1a1a;
      }
      [data-palette="emerald-night"] #splash {
        background: #031f1c;
        --splash-surface: #f1e2c3;
        --splash-mark: #031f1c;
      }
      [data-palette="cobalt-frost"] #splash {
        background: #f7f9fd;
        --splash-surface: #f7f9fd;
        --splash-mark: #101828;
      }
      [data-palette="astral-mist"] #splash {
        background: #030817;
        --splash-surface: #dce4ee;
        --splash-mark: #030817;
      }
      [data-palette="crimson-eclipse"] #splash {
        background: #070709;
        --splash-surface: #e4e4e7;
        --splash-mark: #070709;
      }
      #splash .splash-icon {
        position: relative;
        width: 170px;
        height: 170px;
        display: block;
      }
      /* Les deux pochoirs partagent le même viewBox : c'est ce qui les aligne,
         « contain » les réduisant alors du même facteur dans la même boîte. */
      #splash .splash-icon::before,
      #splash .splash-icon::after {
        content: "";
        position: absolute;
        inset: 0;
      }
      #splash .splash-icon::before {
        background: var(--splash-surface);
        -webkit-mask: url("/castor-surface.svg") center / contain no-repeat;
        mask: url("/castor-surface.svg") center / contain no-repeat;
      }
      #splash .splash-icon::after {
        background: var(--splash-mark);
        -webkit-mask: url("/castor-encre.svg") center / contain no-repeat;
        mask: url("/castor-encre.svg") center / contain no-repeat;
      }
    </style>
  </head>
  <body>
    <!-- "deep" : le splash couvre toute la fenêtre pendant le démarrage, avant
         que React ne monte la bande de déplacement de l'app. Sans lui la fenêtre
         est immobile jusqu'à l'onboarding. L'attribut natif est le seul moyen
         ici : le script d'init Tauri s'exécute avant tout code de la page. -->
    <div id="splash" aria-hidden="true" data-tauri-drag-region="deep">
      <span class="splash-icon"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
