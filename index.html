<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beaver</title>
    <script>
      (function() {
        var themeSchemes = Object.freeze({
          "light": "light",
          "dark": "dark",
          "emerald-night": "dark",
          "cobalt-frost": "light",
          "astral-mist": "dark",
          "crimson-eclipse": "dark"
        });
        var choice = "system";
        try {
          choice = localStorage.getItem("clgo-theme") || "system";
        } catch (_error) {
          choice = "system";
        }
        var colorScheme = Object.prototype.hasOwnProperty.call(themeSchemes, choice)
          ? themeSchemes[choice]
          : null;
        if (!colorScheme) {
          choice = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          colorScheme = choice;
        }
        document.documentElement.setAttribute("data-theme", colorScheme);
        document.documentElement.setAttribute("data-palette", choice);
      })();
    </script>
    <link rel="preload" href="/castor.svg" as="image" type="image/svg+xml" />
    <style>
      #splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      [data-theme="dark"] #splash {
        background: #121212;
        --splash-mark: #c8c8ce;
      }
      [data-theme="light"] #splash {
        background: #f7f6f3;
        --splash-mark: #1a1a1a;
      }
      [data-palette="emerald-night"] #splash {
        background: #031f1c;
        --splash-mark: #f1e2c3;
      }
      [data-palette="cobalt-frost"] #splash {
        background: #f7f9fd;
        --splash-mark: #101828;
      }
      [data-palette="astral-mist"] #splash {
        background: #030817;
        --splash-mark: #dce4ee;
      }
      [data-palette="crimson-eclipse"] #splash {
        background: #070709;
        --splash-mark: #e4e4e7;
      }
      #splash .splash-icon {
        width: 170px;
        height: 170px;
        display: block;
        background: var(--splash-mark);
        -webkit-mask: url("/castor.svg") center / contain no-repeat;
        mask: url("/castor.svg") center / contain no-repeat;
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <span class="splash-icon"></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
