version: 2

# Les mises à jour sont groupées par écosystème : une PR hebdomadaire à relire
# plutôt qu'une par dépendance. Les avis de sécurité restent séparés et
# arrivent immédiatement, sans attendre la fenêtre hebdomadaire.
updates:
  # Maintient à jour les empreintes SHA épinglées dans les workflows. Sans
  # cette entrée, l'épinglage fige les actions sur des versions vulnérables.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-frontend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /src-tauri/resources/extension-host
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-extension-host:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      cargo-backend:
        update-types: [minor, patch]

  # Pas d'entrée `pip` pour les runtimes Forecast, volontairement.
  #
  # Dependabot relie une entrée pip-compile à sa sortie par l'en-tête
  # `--output-file`, et à défaut par la convention `nom.in` → `nom.txt`.
  # `scripts/forecast/lock-runtimes.sh` compile avec `--no-header` vers
  # `nom.<os>.lock` : Dependabot modifierait donc les `.in` sans régénérer les
  # trois `.lock` par OS, qui sont ceux que Rust embarque via `include_str!`.
  # Le `.in` et le `.lock` divergeraient sans que rien ne le signale.
  #
  # Ces montées demandent en plus une validation qu'aucune PR automatique ne
  # peut faire : charger le modèle et prédire. Le 2026-08-19, cette validation a
  # montré que Sundial, Kairos et Moirai ne peuvent PAS suivre les versions
  # corrigées — seul un test d'inférence le révèle, la résolution passe.
  # Les avis de sécurité pip restent signalés : ils ne dépendent pas de ce
  # fichier. La montée reste manuelle, via le script de verrouillage.

  - package-ecosystem: cargo
    directory: /src-tauri/tests/windows-private-store
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      cargo-windows-private-store:
        update-types: [minor, patch]
