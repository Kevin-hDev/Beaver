name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Une passe hebdomadaire rejoue l'analyse avec les requêtes publiées depuis
    # la dernière fusion : une faille connue après coup remonte sans commit.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyse ${{ matrix.language }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write

    strategy:
      # Un extracteur qui échoue ne doit pas priver des résultats des autres.
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:${{ matrix.language }}
