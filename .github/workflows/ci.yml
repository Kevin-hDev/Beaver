name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Validation boundary to run
        required: true
        default: all
        type: choice
        options:
          - all
          - windows-host
          - windows-backend
          - windows-native
          - windows-acceptance-diagnostic
          - macos-native
      source_run_id:
        description: Prior CI run carrying the Windows installer for diagnostic acceptance
        required: false
        default: ""
        type: string

permissions:
  actions: read
  contents: read

# Windows uses the shorter repository-level Cargo target to stay below native
# path limits. Build upload and acceptance download must share this authority.
env:
  WINDOWS_E2E_PACKAGE_DIR: target/e2e/debug/bundle/nsis

# Les séries de PR se remplacent ; celles de main sont conservées car elles
# valident un état déjà fusionné.
#
# Les timeout-minutes remplacent le défaut de 360 minutes, qu'un test bloqué
# consommerait en entier. Ils sont larges exprès : macOS et Windows tournent
# couramment 55 minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Rust)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install SearXNG test Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: scripts/build/searxng-python-version.txt

      - name: SearXNG preparation script tests
        run: npm run test:searxng-scripts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install extension host dependencies
        run: npm ci --ignore-scripts --omit=dev --prefix src-tauri/resources/extension-host

      # The Rust integration test executes scripts/extensions/ui-build.mjs,
      # whose esbuild dependency belongs to the root package.
      - name: Install extension UI builder test dependencies
        run: npm ci --ignore-scripts

      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Format check (bloquant)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Format check for included Rust sources (bloquant)
        env:
          RUSTFMT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/build/check-rust-format.mjs

      - name: Clippy strict (bloquant)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests
        working-directory: src-tauri
        run: cargo test --all

      - name: Ollama manager contracts and historical scenarios
        run: |
          cd src-tauri
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::ollama_manager
          cd ..
          npm run test:ollama-manager-contracts
          npm run test:j3-native-assets

      - name: Persistence contracts
        run: npm run test:persistence-migration

      - name: E2E profile tests and lint
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --features e2e -- -D warnings
          cargo test --all --features e2e

      - name: Linux Landlock confinement
        working-directory: src-tauri
        run: >-
          node ../scripts/ci/run-rust-test-filter.mjs
          --filter services::agent_local::shell_sandbox::linux::tests::landlock_writes_only_inside_the_selected_root
          --ignored --exact --nocapture

  backend-linux-native:
    name: Backend Linux WebView (E2E)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            webkit2gtk-driver \
            xvfb

      - name: Install extension host dependencies
        run: npm ci --ignore-scripts --omit=dev --prefix src-tauri/resources/extension-host

      - name: Install npm dependencies
        run: npm ci

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Native Linux WebView journey
        env:
          E2E_REQUIRE_WEBVIEW_SMOKE: "1"
        run: xvfb-run -a npm run test:e2e:packaged

  backend-windows-native:
    name: Backend Windows CEF (Rust)
    # The packaged journey is deliberately gated by the cheaper real host-load
    # boundary so an extension runtime failure does not consume another 79 minutes.
    needs: windows-extension-host-smoke
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows-native' }}
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install uv for Windows SearXNG recipe
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: latest
          enable-cache: false

      - name: Install Windows SearXNG Python recipe
        shell: pwsh
        env:
          UV_PYTHON_INSTALL_BIN: "1"
        run: |
          $version = (Get-Content -Raw scripts/build/searxng-python-version.txt).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid SearXNG Python version"
          }
          uv python install $version
          if ($LASTEXITCODE -ne 0) {
            throw "SearXNG Python installation failed"
          }
          uv python update-shell
          if ($LASTEXITCODE -ne 0) {
            throw "SearXNG Python PATH publication failed"
          }
          $pythonBin = (uv python dir --bin).Trim()
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $pythonBin -PathType Container)) {
            throw "SearXNG Python executable directory unavailable"
          }
          # setup-uv is isolated from the user installer used in the README;
          # GITHUB_PATH carries uv's verified executable directory to the next shell.
          $pythonBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Une étape séparée ouvre un nouveau PowerShell, comme après la réouverture
      # demandée dans le README, et prouve que l'exécutable publié est utilisable.
      - name: Verify Windows SearXNG Python recipe
        shell: pwsh
        run: |
          $expected = (Get-Content -Raw scripts/build/searxng-python-version.txt).Trim()
          if ($expected -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Invalid SearXNG Python version"
          }
          $command = Get-Command "python$expected" -CommandType Application -ErrorAction Stop
          $actual = & $command.Source --version
          if ($LASTEXITCODE -ne 0 -or $actual -notmatch "^Python $([regex]::Escape($expected))\.") {
            throw "SearXNG Python verification failed"
          }

      - name: Install extension host dependencies
        run: npm ci --ignore-scripts --omit=dev --prefix src-tauri/resources/extension-host

      - name: Cache verified CEF archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/.cef-cache
            src-tauri/.cef-tool-cache
          key: cef-windows-${{ runner.arch }}-${{ hashFiles('src-tauri/cef-artifacts.json', 'src-tauri/cef-build-tools.json', 'scripts/cef/**') }}

      - name: Prepare verified CEF source
        run: node scripts/cef/prepare-cef-source.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: Test Windows package validator
        shell: pwsh
        run: ./scripts/release/check-nsis-migration.test.ps1

      - name: Test Windows package validator with PowerShell 5.1
        shell: powershell
        run: .\scripts\release\check-nsis-migration.test.ps1

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Clippy Windows backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Windows CEF supervision authority
        working-directory: src-tauri
        shell: bash
        run: |
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::browser::cef_supervision::windows_tracker_tests --features windows-tests
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::browser::cef_supervision::capability_tests --features windows-tests

      - name: Ollama manager contracts and historical scenarios
        shell: bash
        run: |
          cd src-tauri
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::ollama_manager --features windows-tests
          cd ..
          npm run test:ollama-manager-contracts
          npm run test:j3-native-assets

      # Build once, then pass the installer to a short acceptance job. A failed
      # acceptance rerun therefore does not spend another hour recompiling CEF.
      - name: Build Windows E2E package
        env:
          E2E_BUILD_ONLY: "1"
        run: npm run test:e2e:packaged

      - name: Upload Windows E2E package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-installer
          path: ${{ env.WINDOWS_E2E_PACKAGE_DIR }}/*.exe
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  windows-extension-host-smoke:
    name: Windows extension host smoke
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows-host' || inputs.target == 'windows-native' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # This boundary runs before CEF: it proves the verified Node executable
      # bundled by Beaver can start and answer the extension protocol.
      - name: Prepare bundled extension host runtime
        run: npm run test:extensions-runtime-smoke

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      # The second boundary exercises Windows Job Object admission and the
      # exact Rust-owned process path used by the installed application,
      # including restart and concurrent isolated hosts.
      - name: Rust owned-process protocol smoke
        working-directory: src-tauri
        shell: bash
        run: |
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::extensions::host_process::prepared_tests::prepared_runtime_ --features windows-tests --ignored --nocapture
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::extensions::runtime_lifecycle::tests::prepared_runtime_confirms_restart_stop_while_exit_monitor_is_active --features windows-tests --exact --ignored --nocapture

  windows-packaged-acceptance:
    name: Windows packaged acceptance (CEF)
    needs: backend-windows-native
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows-native' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download Windows E2E package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-e2e-installer
          path: ${{ env.WINDOWS_E2E_PACKAGE_DIR }}

      - name: Native Windows CEF journey
        env:
          E2E_REQUIRE_CEF_SMOKE: "1"
          E2E_SKIP_BUILD: "1"
          E2E_ARTIFACT_DIR: .e2e-artifacts/windows-cef
        run: npm run test:e2e:packaged

      - name: Upload Windows E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-diagnostics
          path: .e2e-artifacts/windows-cef
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  windows-packaged-acceptance-diagnostic:
    name: Windows packaged acceptance diagnostic (CEF)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.target == 'windows-acceptance-diagnostic' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate prior Windows package run
        shell: pwsh
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          if ($env:SOURCE_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') {
            throw "Invalid source run id"
          }

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download prior Windows E2E package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-e2e-installer
          path: ${{ env.WINDOWS_E2E_PACKAGE_DIR }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.source_run_id }}

      # This is a diagnostic boundary, not packaging proof: it deliberately
      # overlays only the reviewed loader files after installing the old artifact.
      - name: Diagnostic Windows CEF journey
        env:
          E2E_REQUIRE_CEF_SMOKE: "1"
          E2E_SKIP_BUILD: "1"
          E2E_EXTENSION_HOST_DIAGNOSTIC_OVERLAY: "1"
          E2E_ARTIFACT_DIR: .e2e-artifacts/windows-cef-diagnostic
        run: npm run test:e2e:packaged

      - name: Upload Windows diagnostic acceptance results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-e2e-diagnostic-overlay-results
          path: .e2e-artifacts/windows-cef-diagnostic
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  backend-macos-native:
    name: Backend macOS CEF (Rust)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-native' }}
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install extension host dependencies
        run: npm ci --ignore-scripts --omit=dev --prefix src-tauri/resources/extension-host

      - name: Cache verified CEF archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/.cef-cache
            src-tauri/.cef-tool-cache
          key: cef-macos-${{ runner.arch }}-${{ hashFiles('src-tauri/cef-artifacts.json', 'src-tauri/cef-build-tools.json', 'scripts/cef/**') }}

      - name: Prepare verified CEF source
        run: node scripts/cef/prepare-cef-source.mjs

      - name: Install npm dependencies
        run: npm ci

      - name: macOS CEF runtime scripts
        run: npm run test:cef

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Clippy macOS backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Les étapes filtrées qui suivent restent : elles nomment le contrat rompu,
      # ce qu'une suite entière ne fait pas.
      - name: Complete macOS backend suite
        working-directory: src-tauri
        run: cargo test --all -- --test-threads=1

      - name: macOS CEF supervision authority
        working-directory: src-tauri
        run: |
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::browser::cef_supervision::macos::liveness_policy_tests
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::browser::cef_supervision::macos::process_state_tests
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::browser::cef_supervision::macos::emergency_slots_tests
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::browser::cef_supervision::macos::tracker_tests
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::browser::cef_supervision::capability_tests
          node ../scripts/ci/run-rust-test-filter.mjs --filter app_exit::emergency_signaler_tests

      - name: Ollama manager contracts and historical scenarios
        run: |
          cd src-tauri
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::ollama_manager
          cd ..
          npm run test:ollama-manager-contracts
          npm run test:j3-native-assets

      - name: Build macOS E2E package
        env:
          E2E_BUILD_ONLY: "1"
        run: npm run test:e2e:packaged

      # ditto preserves the application bundle metadata and executable modes
      # that a plain artifact upload cannot represent reliably.
      - name: Archive macOS E2E package
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/e2e/debug/bundle/macos/Beaver.app macos-e2e-app.zip

      - name: Upload macOS E2E package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-e2e-app
          path: macos-e2e-app.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  macos-packaged-acceptance:
    name: macOS packaged acceptance (CEF)
    needs: backend-macos-native
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'macos-native' }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Download macOS E2E package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-e2e-app
          path: .e2e-packages/macos

      - name: Restore macOS E2E package
        run: |
          mkdir -p src-tauri/target/e2e/debug/bundle/macos
          ditto -x -k .e2e-packages/macos/macos-e2e-app.zip src-tauri/target/e2e/debug/bundle/macos

      - name: Native macOS CEF journey
        env:
          E2E_REQUIRE_CEF_SMOKE: "1"
          E2E_SKIP_BUILD: "1"
          E2E_ARTIFACT_DIR: .e2e-artifacts/macos-cef
        run: npm run test:e2e:packaged

      - name: Upload macOS E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-e2e-diagnostics
          path: .e2e-artifacts/macos-cef
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

  backend-windows:
    name: Backend Windows tests (Rust)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == 'windows-backend' }}
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install extension host dependencies
        run: npm ci --ignore-scripts --omit=dev --prefix src-tauri/resources/extension-host

      # The complete Rust suite executes the root UI builder integration test.
      - name: Install extension UI builder test dependencies
        run: npm ci --ignore-scripts

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Windows extension installer preflight
        working-directory: src-tauri
        shell: bash
        run: |
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::extensions::git_dependencies_tests::git_materialization_installs_dependencies_without_running_scripts_or_npmrc --features windows-tests --exact --nocapture
          node ../scripts/ci/run-rust-test-filter.mjs --filter services::extensions::npm_runner_tests::local_fixture_install_never_runs_its_lifecycle_script --features windows-tests --exact --nocapture

      # CEF is replaced by its compile-only profile so the complete backend
      # suite can run without loading libcef.dll in the test process.
      # --lib, not --all: build.rs embeds the test manifest through
      # cargo:rustc-link-arg, which reaches every linked target. --all applies it
      # to the application binaries too, which already carry one, and the linker
      # stops on CVT1100. tests/ is therefore covered on Linux only.
      - name: Complete Windows backend tests
        working-directory: src-tauri
        run: cargo test --lib --features windows-tests -- --test-threads=1

      - name: Windows AppContainer confinement
        working-directory: src-tauri
        run: node ../scripts/ci/run-rust-test-filter.mjs --filter services::agent_local::shell_sandbox::windows::tests::appcontainer_writes_only_inside_the_selected_root --features windows-tests --exact --ignored --nocapture

      - name: Windows private storage tests
        working-directory: src-tauri
        run: cargo test --manifest-path tests/windows-private-store/Cargo.toml

  frontend:
    name: Frontend (TS/React)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Brand boundaries contract
        run: npm run test:brand-boundaries

      - name: Unit tests
        run: npm test

      - name: Release version contract
        run: npm run test:release-workflow

      - name: Coverage report (non-blocking)
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  desktop-e2e:
    name: Desktop E2E (CEF)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Cache verified CEF archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            src-tauri/.cef-cache
            src-tauri/.cef-tool-cache
          key: cef-e2e-linux-${{ runner.arch }}-${{ hashFiles('src-tauri/cef-artifacts.json', 'src-tauri/cef-build-tools.json', 'scripts/cef/**') }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Run isolated desktop journey
        run: xvfb-run --auto-servernum npm run test:e2e
