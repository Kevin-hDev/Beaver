name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check (bloquant)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy strict (bloquant)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests
        working-directory: src-tauri
        run: cargo test --all

      - name: Linux Landlock confinement
        working-directory: src-tauri
        shell: bash
        run: |
          tests="$(cargo test --lib -- --ignored --list)"
          grep -Fq 'services::agent_local::shell_sandbox::linux::tests::landlock_writes_only_inside_the_selected_root: test' <<<"$tests"
          cargo test --lib services::agent_local::shell_sandbox::linux::tests::landlock_writes_only_inside_the_selected_root -- --ignored --exact --nocapture

  backend-windows-native:
    name: Backend Windows CEF (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache verified CEF archives
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/.cef-cache
            src-tauri/.cef-tool-cache
          key: cef-windows-${{ runner.arch }}-${{ hashFiles('src-tauri/cef-artifacts.json', 'src-tauri/cef-build-tools.json', 'scripts/cef/**') }}

      - name: Prepare verified CEF source
        run: node scripts/cef/prepare-cef-source.mjs

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy Windows backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  backend-windows:
    name: Backend Windows tests (Rust)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Windows unit tests
        working-directory: src-tauri
        shell: pwsh
        run: |
          cargo test --lib --features windows-tests --no-run
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $binary = Get-ChildItem target/debug/deps/cl_go_dash_lib-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $binary) { throw 'Windows unit-test binary is missing' }

          & $binary.FullName
          $testExit = $LASTEXITCODE
          if ($testExit -eq 0) { exit 0 }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$install\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          & $dumpbin.FullName /imports $binary.FullName

          $debuggers = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64"
          $cdb = Join-Path $debuggers 'cdb.exe'
          $gflags = Join-Path $debuggers 'gflags.exe'
          if ((Test-Path $cdb) -and (Test-Path $gflags)) {
            $trace = Join-Path $env:RUNNER_TEMP 'windows-loader-snaps.log'
            & $gflags /i $binary.Name +sls
            try {
              & $cdb -logo $trace -g -G $binary.FullName --list
              Get-Content $trace -ErrorAction SilentlyContinue |
                Select-String -Pattern 'error|failed|entry|procedure|ordinal|status' -Context 4,4
            } finally {
              & $gflags /i $binary.Name -sls
            }
          } else {
            Write-Output 'Windows debugging tools are unavailable on this runner.'
          }

          exit $testExit

      - name: Windows AppContainer confinement
        working-directory: src-tauri
        shell: pwsh
        run: |
          $tests = cargo test --lib --features windows-tests -- --ignored --list | Out-String
          $expected = 'services::agent_local::shell_sandbox::windows::tests::appcontainer_writes_only_inside_the_selected_root: test'
          if (-not $tests.Contains($expected)) { throw 'Windows AppContainer confinement test is missing' }
          cargo test --lib --features windows-tests services::agent_local::shell_sandbox::windows::tests::appcontainer_writes_only_inside_the_selected_root -- --ignored --exact

      - name: Windows private storage tests
        working-directory: src-tauri
        run: cargo test --manifest-path tests/windows-private-store/Cargo.toml

  frontend:
    name: Frontend (TS/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage report (non-blocking)
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14
