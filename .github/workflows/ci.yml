name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Les séries de PR se remplacent ; celles de main sont conservées car elles
# valident un état déjà fusionné.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install extension host dependencies
        run: npm ci --ignore-scripts --omit=dev --prefix src-tauri/resources/extension-host

      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Format check (bloquant)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Format check for included Rust sources (bloquant)
        env:
          RUSTFMT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/build/check-rust-format.mjs

      - name: Clippy strict (bloquant)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests
        working-directory: src-tauri
        run: cargo test --all

      - name: E2E profile tests and lint
        working-directory: src-tauri
        run: |
          cargo clippy --all-targets --features e2e -- -D warnings
          cargo test --all --features e2e

      - name: Linux Landlock confinement
        working-directory: src-tauri
        shell: bash
        run: |
          tests="$(cargo test --lib -- --ignored --list)"
          grep -Fq 'services::agent_local::shell_sandbox::linux::tests::landlock_writes_only_inside_the_selected_root: test' <<<"$tests"
          cargo test --lib services::agent_local::shell_sandbox::linux::tests::landlock_writes_only_inside_the_selected_root -- --ignored --exact --nocapture

  backend-windows-native:
    name: Backend Windows CEF (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Cache verified CEF archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src-tauri/.cef-cache
            src-tauri/.cef-tool-cache
          key: cef-windows-${{ runner.arch }}-${{ hashFiles('src-tauri/cef-artifacts.json', 'src-tauri/cef-build-tools.json', 'scripts/cef/**') }}

      - name: Prepare verified CEF source
        run: node scripts/cef/prepare-cef-source.mjs

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Clippy Windows backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  backend-macos-native:
    name: Backend macOS CEF (Rust)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install extension host dependencies
        run: npm ci --ignore-scripts --omit=dev --prefix src-tauri/resources/extension-host

      - name: Cache verified CEF archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src-tauri/.cef-cache
            src-tauri/.cef-tool-cache
          key: cef-macos-${{ runner.arch }}-${{ hashFiles('src-tauri/cef-artifacts.json', 'src-tauri/cef-build-tools.json', 'scripts/cef/**') }}

      - name: Prepare verified CEF source
        run: node scripts/cef/prepare-cef-source.mjs

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Check macOS backend
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: Clippy macOS backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

  backend-windows:
    name: Backend Windows tests (Rust)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install extension host dependencies
        run: npm ci --ignore-scripts --omit=dev --prefix src-tauri/resources/extension-host

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Windows extension installer preflight
        working-directory: src-tauri
        run: |
          cargo test --lib --features windows-tests services::extensions::git_dependencies_tests::git_materialization_installs_dependencies_without_running_scripts_or_npmrc -- --exact --nocapture --test-threads=1
          cargo test --lib --features windows-tests services::extensions::npm_runner_tests::local_fixture_install_never_runs_its_lifecycle_script -- --exact --nocapture --test-threads=1

      # CEF is replaced by its compile-only profile so the complete backend
      # suite can run without loading libcef.dll in the test process.
      - name: Complete Windows backend tests
        working-directory: src-tauri
        run: cargo test --lib --features windows-tests -- --test-threads=1

      - name: Windows AppContainer test inventory
        working-directory: src-tauri
        shell: pwsh
        run: |
          $tests = cargo test --lib --features windows-tests -- --ignored --list | Out-String
          $expected = 'services::agent_local::shell_sandbox::windows::tests::appcontainer_writes_only_inside_the_selected_root: test'
          if (-not $tests.Contains($expected)) { throw 'Windows AppContainer confinement test is missing' }

      - name: Windows private storage tests
        working-directory: src-tauri
        run: cargo test --manifest-path tests/windows-private-store/Cargo.toml

  frontend:
    name: Frontend (TS/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage report (non-blocking)
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  desktop-e2e:
    name: Desktop E2E (CEF)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb

      - name: Cache verified CEF archives
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            src-tauri/.cef-cache
            src-tauri/.cef-tool-cache
          key: cef-e2e-linux-${{ runner.arch }}-${{ hashFiles('src-tauri/cef-artifacts.json', 'src-tauri/cef-build-tools.json', 'scripts/cef/**') }}

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Run isolated desktop journey
        run: xvfb-run --auto-servernum npm run test:e2e
