name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies (Tauri)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format check (bloquant)
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy strict (bloquant)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit + integration tests
        working-directory: src-tauri
        run: cargo test --all

      - name: Linux Landlock confinement
        working-directory: src-tauri
        shell: bash
        run: |
          tests="$(cargo test --lib -- --ignored --list)"
          grep -Fq 'services::agent_local::shell_sandbox::linux::tests::landlock_writes_only_inside_the_selected_root: test' <<<"$tests"
          cargo test --lib services::agent_local::shell_sandbox::linux::tests::landlock_writes_only_inside_the_selected_root -- --ignored --exact --nocapture

  backend-windows:
    name: Backend Windows (Rust)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Cache verified CEF archives
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/.cef-cache
            src-tauri/.cef-tool-cache
          key: cef-windows-${{ runner.arch }}-${{ hashFiles('src-tauri/cef-artifacts.json', 'src-tauri/cef-build-tools.json', 'scripts/cef/**') }}

      - name: Prepare verified CEF source
        run: node scripts/cef/prepare-cef-source.mjs

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy Windows backend
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Stage verified CEF beside Windows test binaries
        working-directory: src-tauri
        shell: pwsh
        run: |
          $source = (Resolve-Path -LiteralPath ".cef-verified\current").Path
          $destination = (Resolve-Path -LiteralPath "target\debug\deps").Path
          $runtimeFiles = @(
            "chrome_elf.dll",
            "d3dcompiler_47.dll",
            "dxcompiler.dll",
            "dxil.dll",
            "libEGL.dll",
            "libGLESv2.dll",
            "libcef.dll",
            "vk_swiftshader.dll",
            "vulkan-1.dll"
          )
          foreach ($name in $runtimeFiles) {
            $inputPath = Join-Path $source $name
            $item = Get-Item -LiteralPath $inputPath -Force
            if ($item.PSIsContainer -or
                ($item.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
                $item.Length -lt 1 -or $item.Length -gt 536870912) {
              throw "CEF test runtime is invalid"
            }
            $outputPath = Join-Path $destination $name
            Copy-Item -LiteralPath $inputPath -Destination $outputPath -Force
            if ((Get-Item -LiteralPath $outputPath -Force).Length -ne $item.Length) {
              throw "CEF test runtime staging failed"
            }
          }

      - name: Windows unit tests
        working-directory: src-tauri
        run: cargo test --lib

      - name: Windows AppContainer confinement
        working-directory: src-tauri
        shell: pwsh
        run: |
          $tests = cargo test --lib -- --ignored --list | Out-String
          $expected = 'services::agent_local::shell_sandbox::windows::tests::appcontainer_writes_only_inside_the_selected_root: test'
          if (-not $tests.Contains($expected)) { throw 'Windows AppContainer confinement test is missing' }
          cargo test --lib services::agent_local::shell_sandbox::windows::tests::appcontainer_writes_only_inside_the_selected_root -- --ignored --exact

      - name: Windows private storage tests
        working-directory: src-tauri
        run: cargo test --manifest-path tests/windows-private-store/Cargo.toml

  frontend:
    name: Frontend (TS/React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Coverage report (non-blocking)
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14
