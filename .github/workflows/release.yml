name: Beaver Release Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing version tag (ex: v1.1.0)"
        required: true
      reuse_v123:
        description: "Reuse verified v1.2.3 artifacts from the recovery runs"
        type: boolean
        default: false

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  gate:
    runs-on: ubuntu-22.04

    steps:
      - name: Accept only an existing semantic version tag
        run: |
          if [ "${#RELEASE_TAG}" -gt 33 ] || [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release validation failed." >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "Release validation failed." >&2
            exit 1
          fi
          if [ "${{ inputs.reuse_v123 }}" = "true" ] && [ "$RELEASE_TAG" != "v1.2.3" ]; then
            echo "Release validation failed." >&2
            exit 1
          fi

  validate:
    needs: gate
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install SearXNG test Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: scripts/build/searxng-python-version.txt

      - name: SearXNG preparation script tests
        run: npm run test:searxng-scripts

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Verify bounded app release notes
        run: node scripts/release/prepare-app-release-notes.mjs "$RELEASE_TAG" --check

      - name: Validate Beaver release metadata
        run: |
          node scripts/release/check-brand-artifacts.mjs source "$RELEASE_TAG" .
          node scripts/app-release-notes.mjs "$RELEASE_TAG"

      - name: Frontend tests
        run: npm test

      - name: Frontend build
        run: npm run build

      - name: Frontend lint
        run: npm run lint

      - name: Installer tests
        run: npm run test:install

      - name: Brand boundary tests
        run: npm run test:brand-boundaries

      - name: Persistent profile migration tests
        run: npm run test:persistence-migration

      - name: Beaver release workflow tests
        run: npm run test:release-workflow

      - name: Bridge release tests
        run: npm run test:bridge-release

      - name: Update manifest tests
        run: npm run test:update-manifest

      - name: Rust format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Rust check
        working-directory: src-tauri
        run: cargo check

      - name: Rust clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

  build:
    needs: validate
    if: ${{ !inputs.reuse_v123 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            label: beaver-macos-arm64
            bundles: app,dmg
            bundle_dir: dmg
            asset_suffix: _aarch64.dmg
            installer_suffix: _installer-aarch64.tar.gz
            installer_path: installer/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Beaver Installer.app
            searxng_test_features: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: beaver-linux-x64
            bundles: deb
            bundle_dir: deb
            asset_suffix: _amd64.deb
            installer_suffix: ""
            installer_path: ""
            searxng_test_features: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: beaver-windows-x64
            bundles: nsis
            bundle_dir: nsis
            asset_suffix: _x64-setup.exe
            installer_suffix: _installer-x64.exe
            installer_path: target/x86_64-pc-windows-msvc/release/beaver-installer.exe
            # Rust test executables must not load the CEF DLLs staged by the
            # release build; this is the same isolated profile used by Windows CI.
            searxng_test_features: --features windows-tests

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install SearXNG Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0; SHA is enforced by the release workflow security contract
        with:
          python-version-file: scripts/build/searxng-python-version.txt

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            zstd

      - name: Install npm dependencies
        run: npm ci

      - name: Configure Windows Cargo target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE "target"))
          "CARGO_TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build installer UI
        if: runner.os != 'Linux'
        run: npm run installer:build-ui

      - name: Build installer application
        if: runner.os != 'Linux'
        working-directory: installer
        run: npx --no-install tauri build --target "${{ matrix.target }}" ${{ runner.os == 'macOS' && '--bundles app' || '--no-bundle' }}

      - name: Build Tauri app without publishing
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""
          APPIMAGE_EXTRACT_AND_RUN: "1"
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          CLGO_CEF_ALLOW_ADHOC_SIGNING: ${{ runner.os == 'macOS' && '1' || '0' }}
          BEAVER_TAURI_BUNDLE_TYPE: ${{ matrix.bundles }}
        with:
          args: --target ${{ matrix.target }} --bundles=${{ matrix.bundles }}

      - name: Verify SearXNG offline runtime
        working-directory: src-tauri
        run: cargo test --lib ${{ matrix.searxng_test_features }} services::searxng::runtime_environment_tests::release_wheelhouse_installs_below_the_safety_margin -- --ignored --exact --nocapture

      - name: Resolve exact artifact paths
        id: paths
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          BUNDLE_TARGET: ${{ matrix.target }}
          BUNDLE_DIR: ${{ matrix.bundle_dir }}
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: node scripts/release/resolve-artifact-path.mjs

      - name: Inspect macOS bundle
        if: runner.os == 'macOS'
        run: >-
          node scripts/release/check-brand-artifacts.mjs macos "$RELEASE_TAG"
          "${{ steps.paths.outputs.app }}" "${{ steps.paths.outputs.asset }}"

      - name: Inspect Debian package
        if: runner.os == 'Linux'
        run: |
          ASSET="$(realpath "${{ steps.paths.outputs.asset }}")"
          node scripts/release/check-brand-artifacts.mjs linux "$RELEASE_TAG" "$ASSET"
          bash scripts/release/check-deb-migration.sh "$ASSET"

      - name: Test Windows validator with PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/release/check-nsis-migration.test.ps1

      - name: Test Windows validator with PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\release\check-nsis-migration.test.ps1

      - name: Inspect and install Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BEAVER_INSTALLER: ${{ steps.paths.outputs.asset }}
          CARGO_BUILD_TARGET: ${{ matrix.target }}
          BEAVER_TAURI_BUNDLE_TYPE: ${{ matrix.bundles }}
        run: |
          & scripts/test-install-ps1.ps1
          $installer = (Resolve-Path -LiteralPath $env:BEAVER_INSTALLER).Path
          node scripts/release/check-brand-artifacts.mjs windows $env:RELEASE_TAG $installer
          & scripts/release/check-nsis-migration.ps1 -Mode Source -InstallerPath $installer
          $installDir = Join-Path $env:RUNNER_TEMP "beaver-package-validation"
          $process = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Windows package validation failed."
          }
          $releaseRoot = Join-Path $env:CARGO_TARGET_DIR "$env:CARGO_BUILD_TARGET\release"
          node scripts/cef/tauri-bundle-marker.mjs verify $env:BEAVER_TAURI_BUNDLE_TYPE `
            (Join-Path $installDir "cl-go-dash.exe") `
            (Join-Path $installDir "cl-go-dash.dll") `
            (Join-Path $releaseRoot "cl-go-dash.exe") `
            (Join-Path $releaseRoot "cl_go_dash_lib.dll")
          if ($LASTEXITCODE -ne 0) {
            throw "Windows package validation failed."
          }
          & scripts/release/check-nsis-migration.ps1 -Mode Installed -InstallerPath $installer
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
            -File scripts/release/check-nsis-migration.ps1 -Mode Installed -InstallerPath $installer
          node scripts/voice/check-packaged-resources.mjs $installDir src-tauri/resources/voice-catalog.json
          if ($LASTEXITCODE -ne 0) {
            throw "Windows package validation failed."
          }

      # A rejected candidate is isolated from publication and retained only for root-cause analysis.
      - name: Preserve rejected Windows candidate
        if: failure() && runner.os == 'Windows' && steps.paths.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beaver-windows-x64-rejected-${{ github.run_id }}
          path: ${{ steps.paths.outputs.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload verified native artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.label }}
          path: ${{ steps.paths.outputs.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

      # v1.2.3 is immutable; reuse its app bits with the pinned Windows packaging fix.
      - name: Checkout v1.2.3 Windows packaging fix
        if: runner.os == 'Windows' && env.RELEASE_TAG == 'v1.2.3'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 8ba0bf80dbb2b3c6e3408e775c3ad08e0ab8a45d
          path: .release-packaging-v123
          sparse-checkout: |
            scripts/release
            scripts/file-system
          persist-credentials: false

      - name: Package installer artifact
        id: installer_package
        if: runner.os != 'Linux'
        env:
          INSTALLER_SUFFIX: ${{ matrix.installer_suffix }}
        run: >-
          node "${{ runner.os == 'Windows' && env.RELEASE_TAG == 'v1.2.3' && '.release-packaging-v123/scripts/release/package-installer.mjs' || 'scripts/release/package-installer.mjs' }}" "${{ env.RELEASE_TAG }}"
          "${{ runner.os }}" "${{ matrix.installer_path }}"

      - name: Upload verified installer artifact
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.label }}-installer
          path: ${{ steps.installer_package.outputs.installer_asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  manifest:
    needs: [validate, build]
    if: ${{ always() && needs.validate.result == 'success' && (needs.build.result == 'success' || (inputs.reuse_v123 && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download macOS artifact
        if: ${{ !inputs.reuse_v123 }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beaver-macos-arm64
          path: release-candidate

      - name: Download Linux artifact
        if: ${{ !inputs.reuse_v123 }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beaver-linux-x64
          path: release-candidate

      - name: Download Windows artifact
        if: ${{ !inputs.reuse_v123 }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beaver-windows-x64
          path: release-candidate

      - name: Download macOS installer artifact
        if: ${{ !inputs.reuse_v123 }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beaver-macos-arm64-installer
          path: release-candidate

      - name: Download Windows installer artifact
        if: ${{ !inputs.reuse_v123 }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beaver-windows-x64-installer
          path: release-candidate

      # Both source runs used the immutable v1.2.3 tag. Re-run validation above,
      # then reuse their completed builds instead of repeating two hours of compilation.
      - name: Download recovered v1.2.3 artifacts
        if: inputs.reuse_v123
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-candidate
          for NAME in beaver-macos-arm64 beaver-linux-x64 beaver-windows-x64 beaver-macos-arm64-installer; do
            gh run download 35471762472 --repo Kevin-hDev/Beaver --name "$NAME" --dir release-candidate
          done
          gh run download 35478129815 --repo Kevin-hDev/Beaver --name beaver-windows-x64-installer --dir release-candidate

      - name: Create and validate update manifest
        run: |
          node scripts/release/create-update-manifest.mjs "$RELEASE_TAG" release-candidate
          node scripts/release/check-brand-artifacts.mjs release "$RELEASE_TAG" release-candidate

      - name: Upload complete release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beaver-release-candidate
          path: release-candidate
          if-no-files-found: error
          compression-level: 0
          retention-days: 3

  verify_release:
    needs: manifest
    if: ${{ always() && needs.manifest.result == 'success' }}
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download complete release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beaver-release-candidate
          path: release-candidate

      - name: Independently verify every SHA-256
        run: node scripts/release/check-brand-artifacts.mjs release "$RELEASE_TAG" release-candidate

  attest_release:
    needs: verify_release
    if: ${{ always() && needs.verify_release.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      id-token: write
      attestations: write
      contents: read

    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beaver-release-candidate
          path: release-candidate

      - name: Attest the five assets and manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/*

  publish_release:
    needs: attest_release
    if: ${{ always() && needs.attest_release.result == 'success' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beaver-release-candidate
          path: release-candidate

      - name: Recheck candidate and prepare notes
        id: notes
        run: |
          node scripts/release/check-brand-artifacts.mjs release "$RELEASE_TAG" release-candidate
          NOTES_FILE="$RUNNER_TEMP/beaver-release-notes.md"
          node scripts/app-release-notes.mjs "$RELEASE_TAG" --stdout > "$NOTES_FILE"
          printf 'path=%s\n' "$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Create or update Beaver public release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          DMG="release-candidate/Beaver_${VERSION}_aarch64.dmg"
          DEB="release-candidate/Beaver_${VERSION}_amd64.deb"
          EXE="release-candidate/Beaver_${VERSION}_x64-setup.exe"
          MAC_INSTALLER="release-candidate/Beaver_${VERSION}_installer-aarch64.tar.gz"
          WINDOWS_INSTALLER="release-candidate/Beaver_${VERSION}_installer-x64.exe"
          MANIFEST="release-candidate/update-manifest.json"
          if STATE="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv' 2>/dev/null)"; then
            if [ "$STATE" != $'false\tfalse' ]; then
              echo "Release validation failed." >&2
              exit 1
            fi
            if ! EXISTING_ASSETS="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"; then
              echo "Release validation failed." >&2
              exit 1
            fi
            CHECK_DIR="$(mktemp -d "$RUNNER_TEMP/beaver-existing.XXXXXXXX")"
            trap 'rm -rf "$CHECK_DIR"' EXIT
            while IFS= read -r NAME; do
              case "$NAME" in
                "") continue ;;
                "Beaver_${VERSION}_aarch64.dmg") CANDIDATE="$DMG" ;;
                "Beaver_${VERSION}_amd64.deb") CANDIDATE="$DEB" ;;
                "Beaver_${VERSION}_x64-setup.exe") CANDIDATE="$EXE" ;;
                "Beaver_${VERSION}_installer-aarch64.tar.gz") CANDIDATE="$MAC_INSTALLER" ;;
                "Beaver_${VERSION}_installer-x64.exe") CANDIDATE="$WINDOWS_INSTALLER" ;;
                "update-manifest.json") CANDIDATE="$MANIFEST" ;;
                *)
                  echo "Release validation failed." >&2
                  exit 1
                  ;;
              esac
              gh release download "$RELEASE_TAG" --pattern "$NAME" --dir "$CHECK_DIR"
              EXISTING="$CHECK_DIR/$NAME"
              [ -f "$EXISTING" ] && [ ! -L "$EXISTING" ] &&
                [ "$(find "$CHECK_DIR" -maxdepth 1 -type f | wc -l | tr -d '[:space:]')" = "1" ] || {
                  echo "Release validation failed." >&2
                  exit 1
                }
              EXISTING_HASH="$(sha256sum "$EXISTING" | awk '{print $1}')"
              CANDIDATE_HASH="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
              if [ "$EXISTING_HASH" = "$CANDIDATE_HASH" ]; then
                echo "A release asset already exists; publish a new version." >&2
              else
                echo "A different release asset already exists; manual review required." >&2
              fi
              exit 1
            done <<< "$EXISTING_ASSETS"
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest --title "Beaver $RELEASE_TAG" --notes-file "$NOTES_FILE"
            gh release upload "$RELEASE_TAG" "$DMG" "$DEB" "$EXE" "$MAC_INSTALLER" "$WINDOWS_INSTALLER" "$MANIFEST"
          else
            gh release create "$RELEASE_TAG" "$DMG" "$DEB" "$EXE" "$MAC_INSTALLER" "$WINDOWS_INSTALLER" "$MANIFEST" \
              --verify-tag \
              --latest \
              --title "Beaver $RELEASE_TAG" \
              --notes-file "$NOTES_FILE"
          fi
