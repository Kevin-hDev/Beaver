name: Dependency audit

on:
  # Une revue par changement de dépendances, plus une passe hebdomadaire : une
  # faille publiée après la fusion ne serait vue par aucun déclencheur de PR.
  pull_request:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
      - "scripts/ci/npm-audit-with-retry.mjs"
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  npm:
    name: npm advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Audit npm dependencies
        id: npm-audit
        shell: bash
        run: |
          set +e
          node scripts/ci/npm-audit-with-retry.mjs
          frontend_status=$?
          (cd src-tauri/resources/extension-host && node ../../../scripts/ci/npm-audit-with-retry.mjs)
          host_status=$?
          set -e

          # Exit 75 means the advisory service stayed unavailable after its
          # bounded retry. Any other failure remains authoritative and red.
          if { [ "$frontend_status" -ne 0 ] && [ "$frontend_status" -ne 75 ]; } || \
             { [ "$host_status" -ne 0 ] && [ "$host_status" -ne 75 ]; }; then
            exit 1
          fi
          if [ "$frontend_status" -eq 75 ] || [ "$host_status" -eq 75 ]; then
            echo "service-unavailable=true" >> "$GITHUB_OUTPUT"
          fi

      # npm's advisory endpoint has repeatedly timed out from hosted runners.
      # OSV is an independent fail-closed source, not a bypass for findings.
      - name: Fallback audit when npm advisories are unavailable
        if: steps.npm-audit.outputs.service-unavailable == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@baa4139e56d6312335d899e6ba045fa16d1d3d0b # v2.5.1
        with:
          scan-args: |-
            --lockfile=package-lock.json
            --lockfile=src-tauri/resources/extension-host/package-lock.json

  cargo:
    name: RustSec advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo-audit binary
        id: audit-binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2

      - name: Install cargo-audit
        if: steps.audit-binary.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit backend dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Audit Windows private store dependencies
        if: always()
        run: cargo audit --file src-tauri/tests/windows-private-store/Cargo.lock
