name: Dependency audit

on:
  # Une revue par changement de dépendances, plus une passe hebdomadaire : une
  # faille publiée après la fusion ne serait vue par aucun déclencheur de PR.
  pull_request:
    branches: [main]
    paths:
      - "**/package.json"
      - "**/package-lock.json"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  npm:
    name: npm advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Audit extension host dependencies
        if: always()
        working-directory: src-tauri/resources/extension-host
        run: npm audit --audit-level=high

  cargo:
    name: RustSec advisories
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Cache cargo-audit binary
        id: audit-binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}-0.22.2

      - name: Install cargo-audit
        if: steps.audit-binary.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit backend dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Audit Windows private store dependencies
        if: always()
        run: cargo audit --file src-tauri/tests/windows-private-store/Cargo.lock
